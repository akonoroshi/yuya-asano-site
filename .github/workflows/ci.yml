# Builds main and same-repository pull requests with access to the private package. Astro validates
# every project file against the content schema, so a broken update or a typo fails here, not in production.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sh scripts/install-ci-dependencies.sh
        env:
          VRM_CHARACTERS_DEPLOY_KEY: ${{ secrets.VRM_CHARACTERS_DEPLOY_KEY }}
      - run: npm run build
      - run: npm run test:chat
